receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317 # En hızlı ve verimli yol (Varsayılan)
      http:
        endpoint: 0.0.0.0:4318 # HTTP üzerinden veri göndermek istersek

processors:
  # batch: Gelen verileri tek tek değil, toplu paketler halinde işler.
  # Performansı artırır, ağ trafiğini azaltır.
  batch:
    timeout: 10s
    send_batch_size: 1024

  # attributes: Tüm telemetri verilerine otomatik metadata ekler
  attributes:
    actions:
      - key: environment
        value: ${env:ENVIRONMENT}
        action: insert
      - key: service.name
        value: wordmaster-api
        action: insert

exporters:
  # Elasticsearch exporter: Logları Elasticsearch'e gönderir
  elasticsearch:
    endpoint: "http://elasticsearch:9200"
    mapping:
      mode: ecs

  # Prometheus: Metrics verilerini Prometheus'un okuyabileceği formatta sunar.
  # Prometheus bu porta (8889) gelip veriyi çeker (Scrape).
  prometheus:
    endpoint: "0.0.0.0:8889"

  # debug: Verileri loglara basar (docker logs ile görürsün).
  # Hata ayıklama için çok yararlıdır. Veri geliyor mu diye kontrol edersin.
  debug:
    verbosity: detailed # Tüm detayı göster

service:
  # pipelines: Verinin girişten çıkışa akış haritası.
  pipelines:
    # LOG PIPELINE: OTLP → Batch → Elasticsearch + Debug
    logs:
      receivers: [otlp]
      processors: [batch, attributes]
      exporters: [elasticsearch, debug]

    # METRIC PIPELINE: OTLP → Batch → Prometheus + Debug
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]

  # Collector'ın kendi telemetry'si
  telemetry:
    logs:
      level: info
