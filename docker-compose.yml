services:
  # -----------------------------------------------------------------------------
  # OTEL-COLLECTOR
  # -----------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.142.0
    container_name: wordmaster-otel-collector
    ports:
      - "4317:4317" # gRPC port (uygulama buraya atacak)
      - "4318:4318" # HTTP port (alternatif)
      - "8889:8889" # Prometheus metrics endpoint
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    environment:
      - ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
    depends_on:
      - elasticsearch
    networks:
      - wordmaster-network
    restart: unless-stopped
  # -----------------------------------------------------------------------------
  # PROMETHEUS
  # -----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.8.1
    container_name: wordmaster-prometheus
    ports:
      - "9090:9090" # Prometheus UI portu (Tarayıcıdan erişmek için)
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - wordmaster-network
    restart: unless-stopped
  # -----------------------------------------------------------------------------
  # GRAFANA
  # -----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:12.3.0
    container_name: wordmaster-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA__SECURITY__ADMIN__PASSWORD}
      - GF_SECURITY_ADMIN_USER=${GRAFANA__SECURITY__ADMIN__USER}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - wordmaster-network
    restart: unless-stopped
  # -----------------------------------------------------------------------------
  # ELASTICSEARCH
  # -----------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    container_name: wordmaster-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"  # Memory limit (512MB heap)
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - wordmaster-network
    restart: unless-stopped
  # -----------------------------------------------------------------------------
  # KIBANA
  # -----------------------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.3
    container_name: wordmaster-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - wordmaster-network
    restart: unless-stopped

  # -----------------------------------------------------------------------------
  # DATABASE (SQL Server)
  # -----------------------------------------------------------------------------
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wordmaster-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Express
    command: /opt/mssql/bin/sqlservr -T272
    ports:
      - "1434:1433"
    volumes:
      - mssql-data:/var/opt/mssql # Veri kalıcılığı için volume
    networks:
      - wordmaster-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      retries: 5
      start_period: 30s

  # -----------------------------------------------------------------------------
  # REDIS (Cache)
  # -----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: wordmaster-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - wordmaster-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------------------
  # BACKEND API (.NET)
  # -----------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: WordMaster.API/Dockerfile
    container_name: wordmaster-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__SqlServer=${DOCKER_DB_CONNECTION_STRING}
      - ConnectionStrings__Redis=${DOCKER_REDIS_CONNECTION_STRING:-redis:6379}
      - Jwt__Key=${Jwt__Key}
      - Jwt__Issuer=${Jwt__Issuer}
      - Jwt__Audience=${Jwt__Audience}
      - Jwt__ExpiresInMinutes=${Jwt__ExpiresInMinutes:-15}
      - Jwt__RefreshTokenExpiresInDays=${Jwt__RefreshTokenExpiresInDays:-7}
      - Authentication__Google__ClientId=${Authentication__Google__ClientId}
      - Authentication__Google__ClientSecret=${Authentication__Google__ClientSecret}
      - EmailSettings__Host=${EmailSettings__Host}
      - EmailSettings__Password=${EmailSettings__Password}
      - EmailSettings__Email=${EmailSettings__Email}
      - MailHog__Host=${MailHog__Host}
      - MailHog__Port=${MailHog__Port}
      - MailHog__EnableSsl=${MailHog__EnableSsl:-false}
      - MailHog__FromEmail=${MailHog__FromEmail:-dev@localhost}
      - URLs__Client=${URLs__Client}
      - URLs__Api=${URLs__Api}
      - OpenTelemetry__Endpoint=${OTEL__ENDPOINT}
    ports:
      - "3002:8080" # Dışarıdan 3002, içeriden 8080'e bağlanır
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - wordmaster-network
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro # .env dosyasını container'a mount et (read-only)

  # -----------------------------------------------------------------------------
  # FRONTEND (React + Nginx)
  # -----------------------------------------------------------------------------
  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3002/api/v1}
    container_name: wordmaster-client
    ports:
      - "5173:80" # Dışarıdan 5173, içeriden 80'e (Nginx) bağlanır
    depends_on:
      - api
    networks:
      - wordmaster-network
    restart: unless-stopped

  # -----------------------------------------------------------------------------
  # TOOLS (MailHog, RedisInsight)
  # -----------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - wordmaster-network
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - wordmaster-network

# -----------------------------------------------------------------------------
# VOLUMES & NETWORKS
# -----------------------------------------------------------------------------
volumes:
  mssql-data: # SQL Server verileri kaybolmasın diye
  redis-data: # Redis önbelleği kaybolmasın diye
  grafana-data: # Grafana verileri kaybolmasın diye
  elasticsearch-data: # Elasticsearch verileri kaybolmasın diye

networks:
  wordmaster-network:
    driver: bridge
